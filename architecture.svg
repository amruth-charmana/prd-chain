<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="20" y="70" width="220" height="120" rx="10" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="130" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#1c2b5e">Stage 1</text>
  <text x="130" y="135" text-anchor="middle" font-size="13" fill="#1c2b5e">EXTRACT</text>
  <text x="130" y="158" text-anchor="middle" font-size="11" fill="#42558c">raw text →</text>
  <text x="130" y="174" text-anchor="middle" font-size="11" fill="#42558c">structured intent JSON</text>

  <line x1="240" y1="130" x2="335" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="70" width="220" height="120" rx="10" fill="#eefaf0" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="450" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#1f5c2e">Stage 2</text>
  <text x="450" y="135" text-anchor="middle" font-size="13" fill="#1f5c2e">EXPAND</text>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="#3f7a4d">intent JSON →</text>
  <text x="450" y="174" text-anchor="middle" font-size="11" fill="#3f7a4d">full PRD (markdown)</text>

  <line x1="560" y1="130" x2="655" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="660" y="70" width="220" height="120" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="770" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#7a3b0e">Stage 3</text>
  <text x="770" y="135" text-anchor="middle" font-size="13" fill="#7a3b0e">SCORE (blind)</text>
  <text x="770" y="158" text-anchor="middle" font-size="11" fill="#8f5324">intent + PRD →</text>
  <text x="770" y="174" text-anchor="middle" font-size="11" fill="#8f5324">groundedness JSON</text>

  <line x1="130" y1="70" x2="130" y2="20" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="450" y1="70" x2="450" y2="20" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="20" y="245" font-size="11" fill="#888">Stage 3 never sees Stage 2's prompt or reasoning — only the raw intent and the final PRD text. That separation is what catches hallucinated acceptance criteria.</text>
</svg>
